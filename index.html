<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chettos Academy</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #1a1a1a;
        }

        header {
            background-color: rgba(90, 28, 121, 0.956);
            color: rgb(236, 231, 235);
            text-align: center;
            max-width: 800px;
            margin: 20px auto 0;
            border: 5px solid rgb(163, 160, 174);
            padding: 16px;
            border-radius: 8px;
        }

        main {
            background-color: rgba(13, 14, 13, 0.79);
            color: rgb(221, 221, 228);
            max-width: 800px;
            margin: 20px auto;
            border: 5px solid rgb(46, 156, 12);
            padding: 20px;
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        .artigo {
            display: flex;
            gap: 20px;
            align-items: flex-start;
            text-align: left;
        }

        .artigo img {
            width: 180px;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            flex-shrink: 0;
        }

        .artigo-conteudo {
            flex: 1;
        }

        .artigo-autor {
            font-weight: bold;
            color: #a3a0ae;
        }

        button {
            cursor: pointer;
            padding: 8px 14px;
            font-size: 16px;
            background-color: #5a1c79;
            color: white;
            border: none;
            border-radius: 6px;
            margin-top: 10px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #7a2c99;
        }

        button.curtido {
            background-color: #2e9c0c;
        }
    </style>
</head>
<body>
    <header>
        <h1>Chettos Academy</h1>
        <p>Vamos startar seu primeiro combo! ▶️</p>
    </header>

    <main>
        <!-- Artigo 1 -->
        <article class="artigo">
            <img src="image_blog.png" 
                 alt="Chester Cheetah, o mascote do Cheetos, usando óculos escuros e headset gamer enquanto joga Blox Fruits do Roblox em um monitor ultrawide. Ele está sentado em uma cadeira gamer laranja e preta em um quarto decorado com pacotes de Cheetos, letreiro de neon da marca, quadros de anime e um computador gamer iluminado em tons de laranja.">
            <div class="artigo-conteudo">
                <h2>Sua próxima aventura nesse mar que é o PvP do Blox Fruits</h2>
                <p>Curso completamente grátis</p>
                <p class="artigo-autor">Por: Giovany Correa</p>
                <button class="like-btn">👍 <span class="count">0</span></button>
            </div>
        </article>

        <!-- Artigo 2 -->
        <article class="artigo">
            <img src="https://via.placeholder.com/180x150?text=Curso+Anti-Meta" 
                 alt="Imagem do curso Anti Meta">
            <div class="artigo-conteudo">
                <h2>Curso Anti Meta</h2>
                <p>Sejam bem-vindos ao novo curso de PvP</p>
                <p class="artigo-autor">Por: Rogerio Rodofolco</p>
                <button class="like-btn">👍 <span class="count">0</span></button>
            </div>
        </article>
    </main>

    <script>
        const buttons = document.querySelectorAll(".like-btn");

        buttons.forEach(function(button) {
            button.addEventListener("click", function() {
                const countSpan = button.querySelector(".count");
                let count = parseInt(countSpan.textContent);

                if (button.classList.contains("curtido")) {
                    // Remove curtida
                    count--;
                    button.classList.remove("curtido");
                } else {
                    // Adiciona curtida
                    count++;
                    button.classList.add("curtido");
                }

                countSpan.textContent = count;
            });
        });
    </script>
</body>
</html>
